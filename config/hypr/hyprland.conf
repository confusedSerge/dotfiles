#-------------------------- Basics -------------------------------#

monitor=,preferred,auto,1

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

#-------------------------- Style -------------------------------#

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(ebdbb3aa)
    col.inactive_border = rgba(151515aa)

    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 7
    rounding_power = 2

    shadow {
        enabled = false
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = overshot,       0.13, 0.99, 0.29, 1.02

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = windows,       1,     5,     overshot,        slide
    animation = border,        1,     10,    easeOutQuint
    animation = fade,          1,     10,    quick
    animation = workspaces,    1,     6,     overshot,        slide
}

group {

    col.border_active = rgba(ebdbb3aa)
    col.border_inactive = rgba(151515aa)

    groupbar {
        render_titles = false
        keep_upper_gap = false
        gaps_in = 15
        gaps_out = 5
        col.active = rgba(ebdbb3aa)
        col.inactive = rgba(15151577)

    }
}

#-------------------------- Programs -------------------------------#

$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

exec-once = waybar
exec-once = hyprpaper
exec-once = dunst &
exec-once = $HOME/.config/launch.sh

# -------------------------- Keybindings -------------------------------#

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# -------------------------- Keybindings -------------------------------#

$mainMod = SUPER

# -------------------------- Keybindings: Touchpad -------------------------------#

gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen, maximize
gesture = 3, down, close

# -------------------------- Keybindings: Workspace -------------------------------#

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# -------------------------- Keybindings: Window -------------------------------#

# Move focus with mainMod + hjkl (vim-style, from i3)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Move windows with mainMod + Shift + hjkl (from i3)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# Split direction: period = horizontal, comma = vertical (from i3)
bind = $mainMod, period, layoutmsg, preselect r
bind = $mainMod, comma,  layoutmsg, preselect d

# Toggle layout split (from i3: mod+e)
bind = $mainMod, E, layoutmsg, togglesplit

# Fullscreen toggle (from i3: mod+m)
bind = $mainMod, M, fullscreen, 1

# Kill active window (from i3: mod+shift+q)
bind = $mainMod SHIFT, Q, killactive,

# Toggle floating (from i3: mod+shift+f)
bind = $mainMod, F, togglefloating,

# Toggle pseudotiling
bind = $mainMod, P, pseudo

# Toggle Group
bind = $mainMod, g, togglegroup
bind = $mainMod, tab, changegroupactive

# Resize submap (from i3 resize mode)
submap = resize
binde = , h, resizeactive, -40 0
binde = , j, resizeactive, 0 40
binde = , k, resizeactive, 0 -40
binde = , l, resizeactive, 40 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
bind  = $mainMod, R, submap, reset
submap = reset

bind = $mainMod, R, submap, resize

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# -------------------------- Keybindings: Applications -------------------------------#

# Terminal (from i3: mod+Return → alacritty)
bind = $mainMod, Return, exec, alacritty

# Launcher (from i3: mod+d → rofi drun)
bind = $mainMod, D, exec, rofi -show drun

# Screenshot (from i3: mod+s → flameshot)
# bind = $mainMod, S, exec, flameshot gui

# Lockscreen (from i3: mod+shift+s)
bind = $mainMod SHIFT, S, exec, sh $HOME/.local/bin/lock

# Dunst notification history (from i3: mod+space)
bind = $mainMod, space, exec, dunstctl history-pop

# Hyprland session management (from i3: mod+shift+e exit, mod+shift+r/c reload)
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
